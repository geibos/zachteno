# Те же проверки, что `just ci`, разложенные по отдельным задачам, чтобы
# было видно, какой этап упал: линты и тесты бэкенда, проверки фронтенда,
# актуальность сгенерированных OpenAPI-типов и строгая валидация OpenSpec.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-lint:
    name: Бэкенд — форматирование и clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - working-directory: backend
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  backend-test:
    name: Бэкенд — тесты
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Роли базы (на них ссылаются GRANT в миграциях)
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE zachteno_owner LOGIN PASSWORD 'ci'"
          -c "CREATE ROLE zachteno_app LOGIN PASSWORD 'ci'"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - working-directory: backend
        run: DATABASE_URL="$TEST_DATABASE_URL" cargo test --workspace

  frontend:
    name: Фронтенд — типы, e2e-типы, unit-тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run check:e2e
          npm test

  api-types:
    name: OpenAPI-типы совпадают с бэкендом
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: |
          (cd backend && cargo run -q -p app -- openapi > ../frontend/src/lib/api/openapi.json)
          (cd frontend && npx openapi-typescript src/lib/api/openapi.json -o src/lib/api/schema.d.ts)
          git diff --exit-code -- frontend/src/lib/api/openapi.json frontend/src/lib/api/schema.d.ts

  openspec:
    name: OpenSpec
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict
