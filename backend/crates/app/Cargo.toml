[package]
name = "app"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
domain = { version = "0.1.0", path = "../domain" }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ipnet = "2.12.2"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "smtp-transport", "builder", "ring", "rustls-native-certs"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
mime_guess = "2.0.5"
object_store = { version = "0.14.2", features = ["aws"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls", "http2"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "rust_decimal", "migrate", "macros", "json", "ipnet"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "set-header", "util", "limit", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["uuid", "time", "decimal"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[lints]
workspace = true

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
