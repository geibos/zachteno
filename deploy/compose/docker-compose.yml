# «Зачтено»: приложение, PostgreSQL с WAL-G, Garage для картинок и отдельный Garage для бэкапов.
# Наружу — только app (за любым TLS-прокси); база и хранилища — во внутренних сетях.
# Миграции применяет разовый migrate: пароль владельца схемы есть только у него, не у app.
# Особенности конкретного стенда (метки прокси, внешние сети) — в docker-compose.override.yml рядом.
name: zachteno

x-garage-env: &garage-env
  GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
  GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?}

x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://pg-backups/zachteno
  AWS_ENDPOINT: http://backup-garage:3900
  AWS_REGION: garage
  AWS_S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:?}
  AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:?}
  WALG_COMPRESSION_METHOD: zstd
  PGHOST: /var/run/postgresql

services:
  migrate:
    image: zachteno-app:latest
    build: &app-build { context: ./src, dockerfile: deploy/docker/app.Dockerfile }
    command: ["migrate"]
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      MIGRATION_DATABASE_URL: postgres://zachteno_owner:${ZACHTENO_OWNER_PASSWORD:?}@postgres:5432/zachteno
      RUST_LOG: info
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  app:
    image: zachteno-app:latest
    build: *app-build
    container_name: zachteno-app
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Argon2 (64 МиБ на хеш, параллельно по числу ядер) и перекодирование картинок.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    pids_limit: 512
    # Только то, что нужно приложению: ни пароля суперпользователя Postgres, ни ключей бэкапов.
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      BIND: 0.0.0.0:8080
      # Метрики только внутри контейнера: в общей сети прокси их видели бы все сервисы.
      METRICS_BIND: 127.0.0.1:9100
      PASSWORD_PEPPERS: ${PASSWORD_PEPPERS:?}
      SIGNAL_HMAC_KEY: ${SIGNAL_HMAC_KEY:?}
      SIGNAL_RETENTION_DAYS: ${SIGNAL_RETENTION_DAYS:-365}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_FROM: ${MAIL_FROM:?}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:?}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Без MIGRATION_DATABASE_URL: serve только проверяет, что migrate применил все миграции.
      DATABASE_URL: postgres://zachteno_app:${ZACHTENO_APP_PASSWORD:?}@postgres:5432/zachteno
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: attachments
      ASN_DB_PATH: /data/asn/ip2asn-v4.tsv
      RUST_LOG: info
    volumes:
      - ./data/asn:/data/asn:ro
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      garage: { condition: service_started }

  postgres:
    image: zachteno-postgres:latest
    build: { context: ./src, dockerfile: deploy/docker/postgres.Dockerfile }
    container_name: zachteno-postgres
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      <<: *walg-env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      ZACHTENO_OWNER_PASSWORD: ${ZACHTENO_OWNER_PASSWORD:?}
      ZACHTENO_APP_PASSWORD: ${ZACHTENO_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=300
      - -c
      - wal_level=replica
    volumes:
      - ./src/deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal, backup]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: zachteno-garage
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment: *garage-env
    volumes:
      - ./src/deploy/compose/garage.toml:/etc/garage.toml:ro
      - ./data/garage-meta:/var/lib/garage/meta
      - ./data/garage-data:/var/lib/garage/data
    networks: [internal, backup]

  backup-garage:
    image: dxflrs/garage:v2.4.1
    container_name: zachteno-backup-garage
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      GARAGE_RPC_SECRET: ${BACKUP_GARAGE_RPC_SECRET:?}
      GARAGE_ADMIN_TOKEN: ${BACKUP_GARAGE_ADMIN_TOKEN:?}
    volumes:
      - ./src/deploy/compose/backup-garage.toml:/etc/garage.toml:ro
      - ./data/backup-garage-meta:/var/lib/garage/meta
      - ${BACKUP_DATA_DIR:?}/garage-data:/var/lib/garage/data
    networks: [backup]

  backup:
    image: zachteno-backup:latest
    build: { context: ./src, dockerfile: deploy/docker/backup.Dockerfile }
    profiles: [tools]
    environment:
      <<: *walg-env
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      RCLONE_CONFIG_MAIN_TYPE: s3
      RCLONE_CONFIG_MAIN_PROVIDER: Other
      RCLONE_CONFIG_MAIN_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_MAIN_REGION: garage
      RCLONE_CONFIG_MAIN_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_MAIN_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      RCLONE_CONFIG_VAULT_TYPE: s3
      RCLONE_CONFIG_VAULT_PROVIDER: Other
      RCLONE_CONFIG_VAULT_ENDPOINT: http://backup-garage:3900
      RCLONE_CONFIG_VAULT_REGION: garage
      RCLONE_CONFIG_VAULT_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:?}
      RCLONE_CONFIG_VAULT_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:?}
    volumes:
      - ./src/deploy/compose/backup:/backup:ro
    networks: [internal, backup]

networks:
  internal:
  backup:
